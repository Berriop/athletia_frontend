sonar.projectKey=Berriop_athletia_frontend
sonar.organization=berriop

sonar.sources=src
sonar.tests=src/__tests__
# src/__tests__/** tiene que quedar excluido de sonar.sources: si no, Sonar lo
# indexa a la vez como codigo fuente (por sonar.sources=src) y como codigo de
# prueba (por sonar.tests), y el analisis falla con "can't be indexed twice".
sonar.exclusions=node_modules/**,dist/**,coverage/**,src/__tests__/**

# Ruta al reporte de cobertura que genera vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# El equipo solo escribio pruebas para las 20 funcionalidades (RF) que se estan
# trabajando, no para todo el frontend. Sin esto, el % de cobertura quedaria
# diluido por App.tsx/main.tsx, componentes, layouts, rutas, servicios, tipos
# y las paginas/utilidades que no forman parte de esas 20 RF. Esto NO saca
# esos archivos del analisis de calidad (bugs, code smells, duplicacion siguen
# viendose) - solo los excluye del calculo de cobertura, para que el %
# refleje unicamente las 20 RF (los mismos 12 archivos: RegisterPage,
# LoginPage, AuthContext, ProfilePage, SleepPage, InjuriesPage, WorkoutsPage,
# MealsPage, recoveryScore, NotificationContext, ForgotPasswordPage,
# ResetPasswordPage).
sonar.coverage.exclusions=\
  src/App.tsx,\
  src/main.tsx,\
  src/assets/**,\
  src/components/**,\
  src/layouts/**,\
  src/routes/**,\
  src/services/**,\
  src/types/**,\
  src/pages/AboutPage.tsx,\
  src/pages/AdminPage.tsx,\
  src/pages/ContactPage.tsx,\
  src/pages/DashboardPage.tsx,\
  src/pages/FAQPage.tsx,\
  src/pages/GymFinderPage.tsx,\
  src/pages/LandingPage.tsx,\
  src/pages/NotFoundPage.tsx,\
  src/pages/VerifyEmailPage.tsx,\
  src/utils/smartCoach.ts
